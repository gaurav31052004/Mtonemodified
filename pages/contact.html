<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Contact MT One for support, sales, or partnership inquiries. We're here to help real estate teams succeed.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - MT One</title>
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/main.js" defer></script>
</head>
<body class="font-sans bg-gradient-to-br from-white via-gray-50 to-gray-200 text-gray-800 overflow-x-hidden">
  <!-- Header -->
  <div id="navbar"></div>

  <section class="pt-32 pb-20 px-8 max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row gap-12 items-center">
      
      <!-- Left Column: Form -->
      <div class="flex-1 w-full">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-[#141F39]" style="font-family: 'Outfit', sans-serif;">Get in <span class="text-[#FAAD13]">Touch</span></h1>
        <p class="text-lg text-gray-600 mb-8 font-medium">We'd love to hear from you! Reach out for support, sales, or partnership inquiries.</p>
        
        <form class="space-y-5">
          <input type="text" class="w-full px-4 py-4 border border-[#FAAD13]/30 rounded-xl focus:border-[#FAAD13] outline-none transition-all duration-300 text-[#141F39]" placeholder="Your Name" required>
          <input type="email" class="w-full px-4 py-4 border border-[#FAAD13]/30 rounded-xl focus:border-[#FAAD13] outline-none transition-all duration-300 text-[#141F39]" placeholder="yourname@domain.com" required>
          <input type="tel" class="w-full px-4 py-4 border border-[#FAAD13]/30 rounded-xl focus:border-[#FAAD13] outline-none transition-all duration-300 text-[#141F39]" placeholder="Your Phone Number" pattern="[0-9]{10}" maxlength="10" required>
          <textarea class="w-full px-4 py-4 border border-[#FAAD13]/30 rounded-xl focus:border-[#FAAD13] outline-none transition-all duration-300 text-[#141F39]" rows="5" placeholder="How can we help you?" required></textarea>
          <button type="submit" class="w-full bg-[#FAAD13] text-[#141F39] font-bold py-4 px-6 rounded-xl hover:opacity-90 active:scale-95 transition-all duration-300 cursor-pointer text-center">Send Message</button>
        </form>
      </div>

      <!-- Right Column: Image -->
      <div class="flex-1 w-full flex justify-center">
        <img src="https://res.cloudinary.com/dxk3pdq1w/image/upload/v1779863973/image_14_smw1is.png" alt="Contact Us" class="w-full h-auto rounded-[32px] object-cover shadow-lg max-w-[500px] md:max-w-none">
      </div>

    </div>
  </section>

  <!-- Footer -->
  <div id="footer"></div>
</body>
</html>
