<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Contact MT One for support, sales, or partnership inquiries. We're here to help real estate teams succeed.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - MT One</title>
  <link rel="stylesheet" href="../css/style.css">

<body class="font-sans bg-gradient-to-br from-white via-gray-50 to-gray-200 text-gray-800 overflow-x-hidden">
  <!-- Header -->
  <div id="navbar"></div>

  <main>

  <main>

  <section class="min-h-[40vh] flex items-center justify-center px-8 pt-24 md:pt-32 bg-gradient-to-r from-gold/10 to-orange/10">
    <div class="max-w-3xl text-center">
      <h1 class="text-4xl md:text-5xl font-extrabold mb-4 gradient-text leading-tight">Contact Us</h1>
      <p class="text-lg md:text-xl text-gray-600 mb-8">We'd love to hear from you! Reach out for support, sales, or partnership inquiries.</p>
    </div>
  </section>

  <section class="py-20 px-8 max-w-4xl mx-auto">
    <div class="bg-white/90 rounded-3xl shadow-lg p-10 border border-gold/20 flex flex-col md:flex-row gap-10">
      <div class="flex-1 mb-8 md:mb-0">
        <h2 class="text-2xl font-bold mb-4 text-gold">Get in Touch</h2>
        <form class="space-y-6">
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Name</label>
            <input type="text" class="w-full px-4 py-3 border border-gold/30 rounded-lg focus:ring-gold focus:border-gold outline-none" placeholder="Your Name" required>
          </div>
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Email</label>
            <input type="email" class="w-full px-4 py-3 border border-gold/30 rounded-lg focus:ring-gold focus:border-gold outline-none" placeholder="you@email.com" required>
          </div>
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Phone</label>
            <input type="tel" class="w-full px-4 py-3 border border-gold/30 rounded-lg focus:ring-gold focus:border-gold outline-none" placeholder="Your Phone Number" pattern="[0-9]{10}" maxlength="10" required>
          </div>
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Message</label>
            <textarea class="w-full px-4 py-3 border border-gold/30 rounded-lg focus:ring-gold focus:border-gold outline-none" rows="5" placeholder="How can we help you?" required></textarea>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-gold to-orange text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:-translate-y-1 hover:shadow-xl transition-all duration-300 cursor-pointer">Send Message</button>
        </form>
      </div>
      <div class="flex-1 flex flex-col justify-center">
        <h3 class="text-xl font-semibold mb-4 text-gray-800">Contact Details</h3>
        <p class="mb-2 text-gray-700"><span class="font-semibold">Address:</span> C-116 GF, OfficeOn, Sector 2, Noida, Uttar Pradesh - 201301</p>
        <p class="mb-2 text-gray-700"><span class="font-semibold">Phone:</span> +91 7303062845</p>
        <p class="mb-2 text-gray-700"><span class="font-semibold">Phone:</span> +91 9718361550</p>
        <p class="mb-2 text-gray-700"><span class="font-semibold">Email:</span> <a href="mailto:info@mtone.in" class="text-gold hover:underline">info@mtone.in</a></p>
        <div class="mt-6 flex gap-4">
