<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT One - Admin Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/output.css">
  <script type="module" src="js/main.js" defer></script>
</head>

<body class="font-sans text-gray-800 min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
  <!-- Background Particles -->
  <div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10">
    <div class="absolute w-2 h-2 bg-gold rounded-full animate-float opacity-60"
      style="left: 10%; top: 20%; animation-delay: 0s;"></div>
    <div class="absolute w-1 h-1 bg-gold rounded-full animate-float opacity-40"
      style="left: 20%; top: 80%; animation-delay: 1s;"></div>
    <div class="absolute w-1.5 h-1.5 bg-gold rounded-full animate-float opacity-50"
      style="left: 60%; top: 30%; animation-delay: 2s;"></div>
    <div class="absolute w-2 h-2 bg-gold rounded-full animate-float opacity-30"
      style="left: 80%; top: 70%; animation-delay: 3s;"></div>
    <div class="absolute w-1 h-1 bg-gold rounded-full animate-float opacity-60"
      style="left: 40%; top: 10%; animation-delay: 4s;"></div>
    <div class="absolute w-1.5 h-1.5 bg-gold rounded-full animate-float opacity-40"
      style="left: 90%; top: 40%; animation-delay: 5s;"></div>
  </div>

  <!-- Main Container -->
  <div class="min-h-screen flex items-center justify-center p-4 md:p-8">
    <!-- Login Card -->
    <div
      class="login-card bg-white/95 backdrop-blur-xl border border-gold/20 rounded-3xl p-6 md:p-8 w-full max-w-sm md:max-w-md shadow-2xl relative overflow-hidden">
      <!-- Top Accent Line -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-gold to-orange"></div>

      <!-- Back Button -->
      <button id="back-button"
        class="absolute top-5 left-5 w-10 h-10 md:w-12 md:h-12 bg-white/80 hover:bg-white/90 text-gray-600 hover:text-gray-800 border border-gray-200/50 hover:border-gray-300 rounded-full cursor-pointer hidden items-center justify-center transition-all duration-300 z-20 shadow-lg hover:shadow-xl backdrop-blur-sm group">
        <i
          class="fas fa-arrow-left text-sm md:text-base transition-transform duration-300 group-hover:-translate-x-0.5"></i>
        <!-- Tooltip -->
        <div
          class="absolute left-full ml-3 px-2 py-1 bg-gray-800 text-white text-xs rounded-md opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
          Go Back
          <div
            class="absolute top-1/2 left-0 -translate-x-1 -translate-y-1/2 w-0 h-0 border-t-2 border-b-2 border-r-2 border-t-transparent border-b-transparent border-r-gray-800">
          </div>
        </div>
      </button>

      <!-- Header Section -->
      <div class="text-center mt-6 mb-4">
        <h1 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">Admin Login</h1>
        <p class="text-gray-600 text-base">Administrative Panel</p>
      </div>

      <!-- Logo Section -->
      <div class="text-center mb-6">
        <img src="https://res.cloudinary.com/df1kus7ro/image/upload/v1750484712/MT1_LOGO_ORIGINAL_1_1_iqx9yf.webp"
          alt="MT One Logo" class="w-20 h-20 md:w-24 md:h-24 object-contain mx-auto">
      </div>

      <!-- Step Indicator -->
      <div class="flex justify-center mb-6">
        <div class="flex space-x-3">
          <div id="step-dot-1" class="w-2.5 h-2.5 rounded-full bg-gold transition-all duration-300"></div>
          <div id="step-dot-2" class="w-2.5 h-2.5 rounded-full bg-gray-300 transition-all duration-300"></div>
        </div>
      </div>

      <!-- Loading Message -->
      <div id="loading" class="text-center text-gold font-medium hidden">
        <div class="flex items-center justify-center gap-2">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-gold"></div>
          <span>Loading...</span>
        </div>
      </div>

      <!-- Message Display -->
      <div id="message" class="p-4 rounded-xl mb-4 text-center font-medium hidden mx-auto max-w-full"></div>

      <!-- Step 1: Email Input -->
      <div id="email-input-step" class="step">
        <div class="text-center mb-4">
          <h2 class="text-lg font-semibold text-gray-800 mb-1">Enter Your Email</h2>
          <p class="text-gray-600 text-sm">We'll send you an OTP to verify your identity</p>
        </div>

        <form id="email-form">
          <div class="mb-4">
            <input type="email" id="email" name="email" required placeholder="admin@mtestates.com"
              class="w-full p-3 border-2 border-gray-200 rounded-xl text-base transition-all duration-300 focus:outline-none focus:border-gold text-left">
            <div id="email-error" class="text-red-500 text-sm mt-2 hidden"></div>
          </div>

          <button type="submit" id="send-otp-btn"
            class="w-full bg-gradient-to-r from-gold to-orange text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 hover:shadow-lg transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-gold/50">
            Send OTP
          </button>
        </form>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="otp-verification-step" class="step hidden">
        <div class="text-center mb-4">
          <h2 class="text-lg font-semibold text-gray-800 mb-1">Enter OTP</h2>
          <p class="text-gray-600 text-sm">Please enter the 6-digit code sent to your email</p>
        </div>

        <form id="otp-form">
          <div class="mb-4">
            <input type="text" id="otp" name="otp" required placeholder="••••••" maxlength="6"
              class="w-full p-3 border-2 border-gray-200 rounded-xl text-base transition-all duration-300 focus:outline-none focus:border-gold text-center tracking-widest font-mono">
            <div id="otp-error" class="text-red-500 text-sm mt-2 hidden"></div>
          </div>

          <button type="submit" id="verify-otp-btn"
            class="w-full bg-gradient-to-r from-gold to-orange text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 hover:shadow-lg transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-gold/50">
            Verify OTP
          </button>
        </form>

        <div id="otp-timer" class="text-center text-gray-600 text-sm mt-4 hidden">
          Resend OTP in <span id="timer-countdown">5:00</span>
        </div>

        <div class="text-center mt-4">
          <span id="resend-otp"
            class="text-gold hover:text-orange cursor-pointer text-sm font-medium transition-colors duration-300 hidden">
            Resend OTP
          </span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
